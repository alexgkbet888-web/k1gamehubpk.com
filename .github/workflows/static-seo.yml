name: Static SEO validation

on:
  pull_request:
  push:
    branches:
      - seo/k1-password-help-20260806

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static SEO invariants
        run: node tools/validate-static-seo.mjs
